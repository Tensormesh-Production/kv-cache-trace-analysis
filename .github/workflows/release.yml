name: release

# A tag vX.Y.Z publishes tm-trace for Linux, macOS and Windows (amd64, arm64)
# with a checksums.txt signed with cosign, and the manifests, the Docker
# collector configuration, the format template and install.sh as release assets.
# Tags with a suffix (vX.Y.Z-rc.N) are pre-releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Keyless signing: cosign signs with this workflow's GitHub identity.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.3
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
