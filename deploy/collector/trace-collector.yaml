# Trace collector: receives OTLP on ports 4317 (gRPC) and 4318 (HTTP), keeps only
# request records (LMCache mp.request.trace spans, Dynamo request_payload logs),
# and writes them to /data on a 50 GiB volume (newest 80 files of 512 MB).
apiVersion: v1
kind: ConfigMap
metadata:
  name: trace-collector
  labels:
    app.kubernetes.io/name: trace-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 64
          http:
            endpoint: 0.0.0.0:4318
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      filter/request-trace:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(instrumentation_scope.name, "^lmcache_mp[.]") and name != "mp.request.trace"'
        logs:
          log_record:
            - 'instrumentation_scope.name == "dynamo.request_trace" and attributes["event_type"] != "request_payload"'
      batch/request-trace:
        send_batch_size: 64
        send_batch_max_size: 64
        timeout: 1s
    exporters:
      file/request-trace:
        path: /data/request-trace.jsonl
        rotation:
          max_megabytes: 512
          max_backups: 80
      prometheus/lmcache:
        endpoint: 0.0.0.0:8889
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/request-trace, batch/request-trace]
          exporters: [file/request-trace]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, filter/request-trace, batch/request-trace]
          exporters: [file/request-trace]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [prometheus/lmcache]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trace-collector-data
  labels:
    app.kubernetes.io/name: trace-collector
spec:
  accessModes: ["ReadWriteOnce"]
  # storageClassName: <storage-class>
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-collector
  labels:
    app.kubernetes.io/name: trace-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-collector
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otelcol
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8889
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: trace-collector
        - name: data
          persistentVolumeClaim:
            claimName: trace-collector-data
---
apiVersion: v1
kind: Service
metadata:
  name: trace-collector
  labels:
    app.kubernetes.io/name: trace-collector
spec:
  selector:
    app.kubernetes.io/name: trace-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8889
      targetPort: metrics
